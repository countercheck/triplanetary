services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: triplanetary
      POSTGRES_PASSWORD: triplanetary
      POSTGRES_DB: triplanetary
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triplanetary"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
